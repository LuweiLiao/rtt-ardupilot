# OpenOCD config for ArduPilot on RTT / STM32F7 (CUAV V5)
# STM32F765VI with ST-Link v2 debugger
#
# Usage:
#   openocd -f Tools/debug/openocd-f7.cfg
#   Or with GDB:
#   arm-none-eabi-gdb build/rtt_cuav_v5/rtt_cuav_v5/bin/arducopter -ex "target remote :3333"

source [find interface/stlink.cfg]

# STM32F7xx target (single core Cortex-M7)
source [find target/stm32f7x.cfg]

$_TARGETNAME configure -rtos auto
