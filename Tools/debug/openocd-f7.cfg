# OpenOCD config for ArduPilot on RTT / STM32F7 (CUAV V5)
# STM32F765VI with ST-Link v2 debugger
#
# Usage:
#   openocd -f Tools/debug/openocd-f7.cfg
#   Or with GDB:
#   arm-none-eabi-gdb build/rtt_cuav_v5/rtt_cuav_v5/bin/arducopter -ex "target remote :3333"

source [find interface/stlink.cfg]

# STM32F7xx target (single core Cortex-M7)
source [find target/stm32f7x.cfg]

$_TARGETNAME configure -rtos auto

# Keep watchdogs stopped while the core is halted. CUAV V5 bring-up uses IWDG
# early in Reset_Handler; without this, long GDB/OpenOCD inspections can reset
# the target and clear the very counters being inspected.
$_TARGETNAME configure -event examine-end {
    mww 0xE0042008 0x00001800
}
$_TARGETNAME configure -event halted {
    mww 0xE0042008 0x00001800
}
