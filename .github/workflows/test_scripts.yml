name: test scripts

on:
  push:
    paths-ignore:
      - '.github/workflows/test_rtt.yml'
      - 'Tools/scripts/rtt_*.py'
      - 'Tools/scripts/scons_ardupilot_sources.py'
      - 'docs/rtt-porting/**'
      - 'libraries/AP_HAL_RTT/**'
      - 'modules/rt-thread/**'
  pull_request:
    paths-ignore:
      - '.github/workflows/test_rtt.yml'
      - 'Tools/scripts/rtt_*.py'
      - 'Tools/scripts/scons_ardupilot_sources.py'
      - 'docs/rtt-porting/**'
      - 'libraries/AP_HAL_RTT/**'
      - 'modules/rt-thread/**'
  workflow_dispatch:

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # RTT carries its own SCons-based workflow; keep the generic script/style
    # matrix from gating the dedicated RTT port branches.
    if: ${{ !startsWith(github.ref_name, 'issue/rtt-') && !startsWith(github.head_ref, 'issue/rtt-') }}
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-base:v0.1.3
    strategy:
      fail-fast: false  # don't cancel if a job from the matrix fails
      matrix:
        config: [
            check_autotest_options,
            param_parse,
            python-cleanliness,
            astyle-cleanliness,
            validate_board_list,
            logger_metadata,
            param-file-validation,
       ]
    steps:
      # git checkout the PR
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: test ${{matrix.config}}
        env:
          CI_BUILD_TARGET: ${{matrix.config}}
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          Tools/scripts/build_ci.sh
