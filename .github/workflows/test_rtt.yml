name: test rtt

on:
  push:
    paths:
      - '.github/workflows/test_rtt.yml'
      - 'SConstruct'
      - 'Tools/scripts/rtt_*.py'
      - 'Tools/scripts/scons_ardupilot_sources.py'
      - 'libraries/AP_HAL_RTT/**'
      - 'modules/rt-thread/**'
  pull_request:
    paths:
      - '.github/workflows/test_rtt.yml'
      - 'SConstruct'
      - 'Tools/scripts/rtt_*.py'
      - 'Tools/scripts/scons_ardupilot_sources.py'
      - 'libraries/AP_HAL_RTT/**'
      - 'modules/rt-thread/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scons-build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-base:v0.1.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cuav-v5-copter
            target: cuav-v5
            extra_args: ''
            artifact_bin: build/rtt_cuav_v5/rtthread.bin
            artifact_elf: build/rtt_deploy/cuav_v5/rt-thread.elf
          - name: cuav-v5-l0-boot
            target: cuav-v5
            extra_args: '--test=l0_boot'
            artifact_bin: build/rtt_cuav_v5/rtthread.bin
            artifact_elf: build/rtt_deploy/cuav_v5/rt-thread.elf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install RTT build tools
        run: |
          apt-get update
          apt-get install -y scons python3

      - name: Build ${{ matrix.name }}
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          python3 -m SCons --target=${{ matrix.target }} ${{ matrix.extra_args }} -j"$(nproc)"

      - name: Check RTT artifacts
        shell: bash
        run: |
          test -s "${{ matrix.artifact_bin }}"
          test -s "${{ matrix.artifact_elf }}"
          ls -lh "${{ matrix.artifact_bin }}" "${{ matrix.artifact_elf }}"

      - name: Upload RTT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtt-${{ matrix.name }}
          path: |
            ${{ matrix.artifact_bin }}
            ${{ matrix.artifact_elf }}
            build/rtt_deploy/cuav_v5/rtthread.map
          if-no-files-found: warn
